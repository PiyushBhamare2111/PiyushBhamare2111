<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Piyush Bhamare</title>
  <desc id="d">Mechanical and manufacturing engineer. Process optimization, quality and Lean. M.S. Mechanical Engineering at Northeastern.</desc>
  <defs>
    <radialGradient id="glowA" cx="0.1" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#5b7fa8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5b7fa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="1" r="0.6">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e4e6ec" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .name { font: 700 64px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #eeece8; letter-spacing: -2px; }
      .role { font: 500 24px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #cfced0; }
      .acc { fill: #ff8a3d; }
      .mono { font: 500 14px "SFMono-Regular", Menlo, Consolas, monospace; fill: #9b9ca3; letter-spacing: 2px; }
      .tag { font: 500 13px "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: 1px; }
      .lim { stroke: #ff8a3d; stroke-opacity: 0.55; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .cl { stroke: #cfced0; stroke-opacity: 0.35; stroke-width: 1.2; }
      .trace { fill: none; stroke: #ff8a3d; stroke-opacity: 0.4; stroke-width: 1.5; }
      .pt { fill: #15171d; stroke: #ff8a3d; stroke-width: 1.5; animation: pt 5.5s ease-in-out infinite; }
      @keyframes pt { 0%, 100% { fill: #15171d; r: 4; } 6% { fill: #ffb27a; r: 6; } 16% { fill: #15171d; r: 4; } }
      .gear { fill: none; stroke: #ff8a3d; stroke-opacity: 0.5; stroke-width: 9; stroke-dasharray: 7.85 7.85; transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
      .gear-r { animation-direction: reverse; animation-duration: 9.8s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .pt, .gear { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="#0b0c0f"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowB)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="19.5" fill="none" stroke="#e4e6ec" stroke-opacity="0.1"/>

  <text x="64" y="92" class="mono">DWG NO. PB-2111 · REV A</text>
  <text x="62" y="170" class="name">Piyush Bhamare</text>
  <text x="64" y="216" class="role">Mechanical &amp; <tspan class="acc">manufacturing</tspan> engineer</text>
  <text x="64" y="264" class="tag"><tspan class="acc">Process · Quality · Lean</tspan><tspan fill="#60636c">   /   </tspan><tspan fill="#9b9ca3">M.S. Mechanical Engineering @ Northeastern</tspan></text>

  <!-- An SPC control chart; each point lights in turn, the process stays in control. -->
  <g transform="translate(740 70)">
    <line x1="0" y1="30" x2="360" y2="30" class="lim"/>
    <line x1="0" y1="90" x2="360" y2="90" class="cl"/>
    <line x1="0" y1="150" x2="360" y2="150" class="lim"/>
    <text x="368" y="34" class="tag acc">UCL</text>
    <text x="368" y="94" class="tag" fill="#9b9ca3">CL</text>
    <text x="368" y="154" class="tag acc">LCL</text>
    <polyline class="trace" points="10,96 46,72 82,106 118,84 154,60 190,100 226,116 262,80 298,94 334,70"/>
    <circle cx="10" cy="96" r="4" class="pt" style="animation-delay:0s"/>
    <circle cx="46" cy="72" r="4" class="pt" style="animation-delay:0.55s"/>
    <circle cx="82" cy="106" r="4" class="pt" style="animation-delay:1.1s"/>
    <circle cx="118" cy="84" r="4" class="pt" style="animation-delay:1.65s"/>
    <circle cx="154" cy="60" r="4" class="pt" style="animation-delay:2.2s"/>
    <circle cx="190" cy="100" r="4" class="pt" style="animation-delay:2.75s"/>
    <circle cx="226" cy="116" r="4" class="pt" style="animation-delay:3.3s"/>
    <circle cx="262" cy="80" r="4" class="pt" style="animation-delay:3.85s"/>
    <circle cx="298" cy="94" r="4" class="pt" style="animation-delay:4.4s"/>
    <circle cx="334" cy="70" r="4" class="pt" style="animation-delay:4.95s"/>
    <text x="0" y="186" class="tag" fill="#60636c">X̄ CHART · Cpk 1.67 · IN CONTROL</text>
  </g>

  <!-- Two meshing gears in the corner. -->
  <circle cx="1112" cy="262" r="20" class="gear"/>
  <circle cx="1112" cy="262" r="6" fill="#ff8a3d" fill-opacity="0.5"/>
  <circle cx="1076" cy="278" r="15" class="gear gear-r"/>
  <circle cx="1076" cy="278" r="4.5" fill="#ff8a3d" fill-opacity="0.5"/>
</svg>
